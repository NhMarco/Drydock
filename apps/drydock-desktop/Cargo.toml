[package]
name = "drydock-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "Drydock"
path = "src/main.rs"

[features]
# Debug-only: enables `--screenshot <dir>`, which renders each page to a PNG.
# Never enabled for release builds, so the harness is excluded from shipped binaries.
screenshot = []

[dependencies]
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
# Async HTTP for the persistent disk-backed image loader (matches egui_extras' own version).
ehttp = "0.7"
image.workspace = true
rfd.workspace = true
# Stable disk-cache keys for the image loader (DefaultHasher is not stable across Rust releases).
sha2.workspace = true
drydock-core = { path = "../../crates/drydock-core" }

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
