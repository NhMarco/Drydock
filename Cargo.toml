[workspace]
members = [
    "apps/drydock-desktop",
    "crates/drydock-core",
]
resolver = "2"

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "GPL-2.0-only"
authors = ["Drydock contributors"]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
base64 = "0.22"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36.1"
egui_extras = { version = "0.36.1", default-features = false, features = ["http", "image"] }
# zlib-rs backend, not flate2's default miniz_oxide: Windows Explorer's built-in ZIP extractor
# ("zipfldr") fails with "unexpected error" on miniz_oxide deflate streams past roughly 13 MiB of
# compressible input, which silently drops steamclient64.dll from an exported crack. zlib-rs
# streams extract fine. Also applies to `zip`, which compresses through flate2.
flate2 = { version = "1", features = ["zlib-rs"] }
hmac = "0.12"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
jiff = "0.2"
open = "5.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
rfd = "0.17.2"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
sysinfo = "0.37"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "symbols"
