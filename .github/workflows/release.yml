name: Native release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing is built or published until the tag is shown to be a real release of reviewed code.
  # `main` is protected by a ruleset (pull request + code-owner review), but a tag is a separate ref:
  # anyone able to push one could otherwise publish a release from a branch that never passed review.
  # A tag ruleset keeps non-admins from creating `v*` at all; this is the second half, and it also
  # catches the honest mistake of tagging a local branch that was never pushed to main.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.0"
            exit 1
          fi
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not contained in main." \
                 "Release only from main: merge the work first, then tag the commit on main."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is contained in main."

  validation:
    needs: guard
    uses: ./.github/workflows/ci.yml

  # Which platforms this repository releases. All of them unless the repository variable
  # RELEASE_PLATFORMS names fewer (e.g. "windows-x64 linux-x64") — a white-label repository can
  # leave some out without editing this file, so it keeps pulling Drydock's without conflicts.
  plan:
    needs: guard
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: python
        env:
          WANTED: ${{ vars.RELEASE_PLATFORMS }}
        run: |
          import json, os, sys
          # `platform` is the platform part of each asset name; the product name goes in front:
          # Drydock here, or the name in a white-label repository's brand/brand.toml.
          platforms = [
              {"key": "windows-x64", "runner": "windows-2025", "platform": "windows-x64.exe", "extension": ".exe"},
              {"key": "windows-arm64", "runner": "windows-11-arm", "platform": "windows-arm64.exe", "extension": ".exe"},
              {"key": "linux-x64", "runner": "ubuntu-24.04", "platform": "linux-x64", "extension": ""},
              {"key": "linux-arm64", "runner": "ubuntu-24.04-arm", "platform": "linux-arm64", "extension": ""},
          ]
          known = [entry["key"] for entry in platforms]
          wanted = os.environ.get("WANTED", "").replace(",", " ").split()
          unknown = [key for key in wanted if key not in known]
          if unknown:
              print(f"::error::RELEASE_PLATFORMS names unknown platforms {unknown}; known: {known}")
              sys.exit(1)
          chosen = [entry for entry in platforms if not wanted or entry["key"] in wanted]
          print("Releasing for", ", ".join(entry["key"] for entry in chosen))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("matrix=" + json.dumps({"include": chosen}), file=output)

  build:
    needs: [guard, validation, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.key }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Derive and validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.0" >&2
            exit 1
          fi
          echo "DRYDOCK_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          # The release is named after the product: Drydock, or a white-label repository's brand
          # (the build picks the brand up by itself; only the file names need it here). Test for the
          # file first: Actions runs bash with `-e -o pipefail`, so a sed on a missing file would end
          # the step instead of falling back to Drydock.
          product=Drydock
          if [[ -f brand/brand.toml ]]; then
            name=$(sed -n 's/^name *= *"\([A-Za-z0-9_-]*\)".*/\1/p' brand/brand.toml | head -n 1)
            product="${name:-Drydock}"
          fi
          echo "BINARY=target/release/Drydock${{ matrix.extension }}" >> "$GITHUB_ENV"
          echo "ASSET=${product}-${{ matrix.platform }}" >> "$GITHUB_ENV"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev libxi-dev pkg-config
      - name: Build release with its update channel
        env:
          # The channel shipped binaries check for updates: the repository publishing this release,
          # so a white-label repository's binaries follow its own releases, never Drydock's.
          DRYDOCK_UPDATE_REPOSITORY: ${{ github.repository }}
          # Baked into the shipped binary so it can reach the self-hosted proxy and sign its
          # requests. The proxy holds the steamtools key and GitHub token server-side, so the app
          # no longer embeds either. Absent secrets embed nothing, so an unconfigured build simply
          # cannot reach the proxy (same safe fallback as before).
          DRYDOCK_PROXY_BASE_URL: ${{ secrets.DRYDOCK_PROXY_BASE_URL }}
          DRYDOCK_HMAC_SECRET: ${{ secrets.DRYDOCK_HMAC_SECRET }}
          # Only a repository whose releases are private sets this: a fine-grained, read-only token
          # for itself, so its binaries can fetch its releases. Drydock's are public and set none.
          DRYDOCK_UPDATE_TOKEN: ${{ secrets.DRYDOCK_UPDATE_TOKEN }}
        run: cargo build --locked --release -p drydock-desktop
      - name: Run packaged binary self-test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$BINARY" --self-test
          actual=$("$BINARY" --version | tr -d '\r')
          test "$actual" = "$DRYDOCK_RELEASE_VERSION"
      - name: Run packaged binary self-test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = (Resolve-Path $env:BINARY).Path
          function Invoke-DrydockCli([string]$Argument, [string]$Name) {
            $stdout = Join-Path $env:RUNNER_TEMP "$Name.txt"
            $stderr = Join-Path $env:RUNNER_TEMP "$Name-error.txt"
            $process = Start-Process -FilePath $binary -ArgumentList $Argument `
              -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if ($process.ExitCode -ne 0) {
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Drydock $Argument failed with exit code $($process.ExitCode)"
            }
            [string]$text = Get-Content -Raw $stdout
            return $text.Trim()
          }
          $selfTest = Invoke-DrydockCli "--self-test" "self-test"
          Write-Host $selfTest
          $actual = Invoke-DrydockCli "--version" "version"
          if ($actual -ne $env:DRYDOCK_RELEASE_VERSION) {
            throw "Packaged version '$actual' does not match '$env:DRYDOCK_RELEASE_VERSION'"
          }
      - name: Stage native binary
        shell: bash
        run: |
          mkdir -p dist
          cp "$BINARY" "dist/$ASSET"
          cd dist
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          # The built-in token suffices: code and releases live in the same repository, and the
          # workflow already requests `contents: write` above. (A personal access token was only
          # needed back when this published into a *different* repository, which github.token
          # cannot do.)
          GH_TOKEN: ${{ github.token }}
        # `--repo` is required: this job only downloads artifacts and never checks the repository
        # out, so `gh` has no git directory to infer the target from. `github.repository` keeps that
        # correct in forks too.
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
