name: Rust validation

# Run manually or as a release prerequisite; ordinary pushes and PRs do not consume minutes.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # The proxy is deployed on its own and is not part of an app release, so a release does not wait
  # for it; run this workflow by hand to check proxy changes.
  proxy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker build -t drydock-proxy:check .

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev libxi-dev pkg-config
      - run: cargo check --workspace --locked

  quality:
    runs-on: windows-2025
    # A test that hangs fails the job instead of holding a release for the six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  native-build:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            artifact: Drydock-windows-x64
            binary: target/release/Drydock.exe
          - name: Windows ARM64
            runner: windows-11-arm
            artifact: Drydock-windows-arm64
            binary: target/release/Drydock.exe
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: Drydock-linux-x64
            binary: target/release/Drydock
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: Drydock-linux-arm64
            binary: target/release/Drydock
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev libxi-dev pkg-config
      - run: cargo build --locked --release -p drydock-desktop
      - name: Run packaged binary self-test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: '"${{ matrix.binary }}" --self-test'
      - name: Run packaged binary self-test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = (Resolve-Path "${{ matrix.binary }}").Path
          $stdout = Join-Path $env:RUNNER_TEMP "drydock-self-test.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "drydock-self-test-error.txt"
          $process = Start-Process -FilePath $binary -ArgumentList "--self-test" `
            -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
