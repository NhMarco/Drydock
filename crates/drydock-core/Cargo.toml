[package]
name = "drydock-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
hmac.workspace = true
html-escape.workspace = true
jiff.workspace = true
open.workspace = true
aes-gcm.workspace = true
base64.workspace = true
rand.workspace = true
rsa.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
sysinfo.workspace = true
walkdir = "2.5"
zip.workspace = true
# Depot download (DepotDownloader-equivalent): AES depot-chunk decryption + VZip(LZMA)/deflate.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
flate2.workspace = true
# The same build sevenz-rust2 already pulls in, so VZip decoding adds nothing to compile.
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "optimization"] }
zstd = "0.13"
# Chunk checksums (already built for flate2); the SIMD path is picked at run time.
simd-adler32 = { version = "0.3.10", default-features = false, features = ["std"] }
# Emu toolchain: gbe_fork ships its steamclient DLLs in a 7z archive (LZMA2 with BCJ filters, which
# need no optional feature). The defaults would add AES, BZip2 and PPMd decoders nothing here reads.
sevenz-rust2 = { version = "0.22.2", default-features = false }
tempfile = "3.23"
cap-std = "4.0.3"

[dev-dependencies]
# The toolchain and depot tests build their fixture archives and chunks.
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["compress"] }
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "optimization", "encoder"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
